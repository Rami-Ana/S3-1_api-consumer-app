<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ana Ramírez Moreno">
    <title>S3.01 | Consumo de API con Axios y Fetch </title>

    <!-- CDN: cargar Axios sin instalar -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="styles.css">


</head>

<body>
    <div class="app-container"> <!-- contenedor principal -->
        <header> <!-- Header -->
            <div class="">
                <h1>Buscador de Lorem Ipsum</h1>
                <h3>Escribe la palabra que aparece en el lorem Ipsum:</h2>
                <select id="apiSelector">
                    <option value="0">---Selecciona herramienta---</option>
                    <option value="axios">Usar Axios</option>
                    <option value="fetch">Usar Fetch</option>
                </select>
                <input type="text" id="searchInput" placeholder="Buscar...">
                <button id="getDataButton">Buscar Lorem</button>
            </div>

        </header>   

        <main> <!-- main con estados resultados y paginación -->
            <p id="loadingMessage" class="hidden">Cargando...</p> <!--Estado de carga-->
            <p id="errorMessage" class="hidden"></p> <!--Estado error-->
            <section>
                <section id="results"></section> <!--No <p>, serán varias cards-->
            </section>
            <nav id="pagination" class="pagination"> <!-- navegación -->
                <!-- paginación dinamc en JS-->
            </nav>
        </main>
    </div>


</body>

</html>
